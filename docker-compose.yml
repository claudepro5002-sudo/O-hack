services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ostrovok-trip-agent:1.0.0
    # образ мультиархитектурный; amd64 зафиксирован для одинаковой сборки на Apple Silicon и x86
    platform: linux/amd64
    container_name: trip-agent
    ports:
      - "${APP_PORT:-8080}:8080"
    # .env необязателен: без него агент запускается на встроенных правилах, без LLM
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/agent.db  # база всегда в volume, даже если в .env DB_PATH пустой
    volumes:
      - agent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Прогон тестового набора сценариев после того, как приложение стало healthy.
  # Запускается по требованию: docker compose --profile eval up eval
  eval:
    image: ostrovok-trip-agent:1.0.0
    platform: linux/amd64
    profiles: ["eval"]
    command: ["python", "-m", "eval.run_eval"]
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/agent.db
    volumes:
      - agent-data:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  agent-data:
