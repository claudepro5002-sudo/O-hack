<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Трип-агент Островка</title>
  <meta name="description" content="AI-агент: от одного сообщения до оформленной поездки">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%230a7cff'/><path d='M14 38c8-10 28-10 36 0' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/><circle cx='32' cy='24' r='6' fill='white'/></svg>">
  <script>
    // тема до отрисовки, чтобы страница не мигала светлой: сохранённый выбор, иначе — как в системе
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=6">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">◉</span>
    <span class="brand-name">островок</span>
    <span class="brand-sub">трип-агент</span>
  </div>
  <nav class="top-actions">
    <button class="ghost chats-toggle" data-open="chats">Чаты</button>
    <button class="ghost" data-open="trips">Мои поездки</button>
    <button class="ghost" data-open="memory">Память</button>
    <button class="ghost" data-open="metrics">Метрики</button>
    <button class="ghost theme-toggle" id="themeToggle" aria-label="Тёмная тема" title="Тёмная тема">🌙</button>
    <button class="primary small" id="newTrip">Новая поездка</button>
    <button class="ghost panel-toggle" id="panelToggle" aria-label="План поездки">План</button>
  </nav>
</header>

<main class="layout">
  <aside class="chats" id="chats" aria-label="Чаты">
    <div class="chats-head"><span>Чаты</span><button class="small" id="newChat" title="Новый чат">＋ Новый</button></div>
    <ul class="chat-list" id="chatList"></ul>
  </aside>

  <section class="chat">
    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="chips" class="chips"></div>
    <form id="composer" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Например: к тёплому морю в ноябре с ребёнком 5 лет, недорого, без долгих перелётов"></textarea>
      <button type="submit" class="primary" id="sendBtn" aria-label="Отправить">➤</button>
    </form>
  </section>

  <aside class="panel" id="panel">
    <div class="panel-card mobile-only">
      <button class="ghost" data-open="trips">Мои поездки</button>
      <button class="ghost" data-open="memory">Память</button>
      <button class="ghost" data-open="metrics">Метрики</button>
    </div>
    <div class="panel-card">
      <div class="panel-title">Что я понял <span class="hint">поправьте и нажмите «Применить»</span></div>
      <form id="tripForm" class="trip-form" autocomplete="off">
        <label>Откуда<input name="origin" placeholder="Москва"></label>
        <label>Куда<input name="destination" placeholder="подобрать за меня"></label>
        <div class="row2">
          <label>С<input type="date" name="date_from"></label>
          <label>По<input type="date" name="date_to"></label>
        </div>
        <div class="row2">
          <label>Взрослых<input type="number" name="adults" min="1" max="12" placeholder="2"></label>
          <label>Детей<input type="number" name="children" min="0" max="10" placeholder="0"></label>
        </div>
        <button class="primary" type="submit">Применить</button>
      </form>
    </div>
    <div class="panel-card">
      <div class="panel-title">Что важнее</div>
      <div class="segmented" id="priority">
        <button data-p="price">Цена</button><button data-p="balance">Баланс</button>
        <button data-p="comfort">Комфорт</button><button data-p="time">Дорога</button>
      </div>
    </div>
    <div class="panel-card" id="cartCard" hidden>
      <div class="panel-title">Корзина</div>
      <div id="cartMini"></div>
    </div>
    <div class="panel-card grow">
      <div class="panel-title">Ход мыслей агента <span class="hint" id="elapsed"></span></div>
      <ol id="trace" class="trace"><li class="muted">Здесь видно, что агент понял, какие инструменты вызвал и почему.</li></ol>
    </div>
  </aside>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="/static/app.js?v=6"></script>
</body>
</html>
